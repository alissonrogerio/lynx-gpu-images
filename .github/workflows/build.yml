name: build
on:
  push:
    branches: [main]
    paths: ["images/**", ".github/workflows/build.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  wangp-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk (image is ~10 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/lynx-wangp-runtime
          TAG=cu128-torch2.10-wangp738fca1
          docker build -t $IMG:$TAG \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.description="Generic CUDA 12.8 + torch 2.10 runtime for WanGP-based jobs (no WanGP code, no weights, no data)" \
            images/wangp-runtime
          docker push $IMG:$TAG
          docker inspect --format '{{index .RepoDigests 0}}' $IMG:$TAG | tee digest.txt
          docker image ls $IMG
      - uses: actions/upload-artifact@v4
        with:
          name: digest
          path: digest.txt
